bundle:
  name: Databricks_Project

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-77b9262b-fdb2.cloud.databricks.com

  prod:
    workspace:
      host: https://dbc-77b9262b-fdb2.cloud.databricks.com
      root_path: /Workspace/Users/ognjen.antonic1997@gmail.com/.bundle/${bundle.name}/prod

resources:
  jobs:
    ingest_fda_job:
      name: ingest_fda_job
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./ingest_fda.py
        - task_key: bronze
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ./bronze_fda.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./silver_fda.py
